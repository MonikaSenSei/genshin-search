<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神全文检索 · Teyvat Text Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader">
  <div class="loader-box">
    <div class="loader-title">原神全文检索</div>
    <div class="loader-sub">官方游戏文本 + 官方社媒公告 · 数据全部在本机浏览器内检索，不上传任何查询</div>
    <div id="load-status" class="status">正在准备…</div>
    <div class="load-bar"><div id="load-bar-fill"></div></div>
  </div>
</div>
<header>
  <h1>原神全文检索</h1>
  <p class="sub">官方游戏文本 + 官方社媒公告 · 数据全部在本机浏览器内检索，不上传任何查询</p>
</header>
<main>
  <form id="searchform">
    <input id="q" type="search" placeholder="输入关键词，如：法涅斯 / 虚假之天" autocomplete="off" disabled>
    <button type="submit" disabled>检索</button>
    <label class="aliasbox"><input id="usealias" type="checkbox" checked> 别名扩展</label>
  </form>
  <div id="summary"></div>
  <section id="titles-sec" class="sec">
    <h2 class="h">书名匹配</h2>
    <div id="titles"></div>
  </section>
  <section id="chars-sec" class="sec">
    <h2 class="h">角色匹配</h2>
    <div id="chars"></div>
  </section>
  <section id="creatures-sec" class="sec">
    <h2 class="h">生物匹配</h2>
    <div id="creatures"></div>
  </section>
  <section id="items-sec" class="sec">
    <h2 class="h">物品匹配</h2>
    <div id="items"></div>
  </section>
  <section id="game-sec" class="sec">
    <h2 id="game-h" class="h">游戏语料</h2>
    <div id="strong"></div>
    <div id="weak"></div>
  </section>
  <section id="social-sec" class="sec">
    <h2 class="h">社媒公告</h2>
    <div id="social"></div>
  </section>
</main>
<footer id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
